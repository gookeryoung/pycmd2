[package]
edition = "2024"
name = "_pycmd2"
version = "0.5.3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]
name = "_pycmd2"

[dependencies]
pyo3 = { version = "0.25.0", features = ["extension-module"] }

[profile.release]
lto = true
opt-level = "z" # Optimize for size.
strip = true
